name: Omaudit

on:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Omaudit v0.1.0
        run: curl -fsSL https://raw.githubusercontent.com/omarchy-forge/omaudit/v0.1.0/install.sh | bash -s -- --version v0.1.0
      - name: Audit capabilities
        run: "$HOME/.local/bin/omaudit" verify . --max-grade B
