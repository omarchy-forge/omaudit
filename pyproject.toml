[project]
name = "omaudit"
version = "0.1.0"
description = "Capability audit for Omarchy Quattro shell plugins"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://www.omarchyforge.com/projects"
Repository = "https://github.com/omarchy-forge/omaudit"
Issues = "https://github.com/omarchy-forge/omaudit/issues"

[project.scripts]
omaudit = "omaudit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["omaudit"]
